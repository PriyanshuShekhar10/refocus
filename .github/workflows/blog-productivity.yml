name: "Blog: Productivity"

# Generic / productivity niche — once daily at 06:00 UTC (~11:30 IST).
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-niche-productivity
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      category: productivity
    secrets: inherit
