name: "Blog: Productivity"

# Manual only — scheduled publishing is the 3 rotating daily slots.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-niche-productivity
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      category: productivity
    secrets: inherit
