name: Auto-generate blog post

# Publishes a new Refocus blog post on a schedule (and on demand). Commits land
# on the `landing` branch only — never on `test-dash` — so the hourly blog
# does not trigger Vercel dashboard deploys.
#
# This file lives on the default branch (`test-dash`) so GitHub's schedule
# can run it. The job always checks out and pushes to `landing`.

on:
  schedule:
    # Every hour at :00 UTC. Cron on GitHub uses UTC.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic/angle for the post (blank = auto-pick)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: blog-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout landing branch
        uses: actions/checkout@v4
        with:
          ref: landing

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: marketing/package-lock.json

      - name: Install marketing dependencies
        working-directory: marketing
        run: npm ci

      - name: Generate post
        working-directory: marketing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          POST_TOPIC: ${{ github.event.inputs.topic }}
        run: node scripts/generate-post.mjs

      - name: Commit & push new post to landing
        run: |
          git config user.name "refocus-blog-bot"
          git config user.email "bot@refocus.co.in"
          if [ -n "$(git status --porcelain marketing/src/content/blog)" ]; then
            git add marketing/src/content/blog
            git commit -m "blog: auto-generated post ($(date -u +%Y-%m-%d))"
            git push origin HEAD:landing
          else
            echo "No new post to commit."
          fi

      - name: Build site
        working-directory: marketing
        run: npm run build

      - name: Deploy to Cloudflare Pages
        working-directory: marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy dist
          --project-name refocus-marketing
          --branch landing
          --commit-dirty=true
