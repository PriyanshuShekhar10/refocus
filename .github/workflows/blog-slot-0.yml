name: "Blog: morning slot (English)"

# First of three English posts/day. Niche rotates across ten community
# categories (med-school … teachers).
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-slot-0
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      slot: "0"
      locale: en
    secrets: inherit
