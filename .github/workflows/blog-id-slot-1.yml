name: "Blog: Indonesian (evening) — manual only"

# Disabled: ID is 1/day (blog-id-slot-0 @ 10:00 UTC). Use workflow_dispatch for extras.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-id-slot-1
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      locale: id
      slot: "1"
    secrets: inherit
