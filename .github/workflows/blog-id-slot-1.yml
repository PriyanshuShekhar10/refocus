name: "Blog: Indonesian evening (manual)"

# Manual only — scheduled non-English publishing is blog-locale-daily.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-id-slot-1
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      locale: id
      slot: "1"
    secrets: inherit
