name: "Blog: Competitive exams"

# Manual only — scheduled publishing is the 3 rotating daily slots.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-niche-exams
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      category: exams
    secrets: inherit
