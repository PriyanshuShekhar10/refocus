name: "Blog: Competitive exams"

# UPSC / JEE / NEET / CAT / GATE / etc. — once daily at 12:00 UTC (~17:30 IST).
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-niche-exams
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      category: exams
    secrets: inherit
