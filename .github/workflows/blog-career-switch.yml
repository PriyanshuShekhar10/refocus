name: "Blog: Career switchers"

# Manual only — scheduled English publishing is blog-slot-0/1/2.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-niche-career-switch
  cancel-in-progress: false

jobs:
