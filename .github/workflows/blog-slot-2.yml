name: "Blog: evening slot"

# Third of three daily posts. Niche rotates across the five categories.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-slot-2
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      slot: "2"
    secrets: inherit
