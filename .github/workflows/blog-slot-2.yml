name: "Blog: evening slot (English)"

# Third English post/day (morning + afternoon + evening).
# Niche rotates across the ten community categories.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-slot-2
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      slot: "2"
      locale: en
    secrets: inherit
