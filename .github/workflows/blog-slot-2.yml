name: "Blog: evening slot (English)"

# Manual only — scheduled English publishing is one post/day via blog-slot-0.
# Niche rotates across the ten community categories when a slot is supplied.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-slot-2
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      slot: "2"
      locale: en
    secrets: inherit
