name: "Blog: evening slot (English)"

# Manual only — English capped at 2 high-quality posts/day
# (blog-slot-0 morning + blog-slot-1 afternoon).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-slot-2
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      slot: "2"
      locale: en
    secrets: inherit
