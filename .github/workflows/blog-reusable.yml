name: Blog niche (reusable)

# Called by per-niche hourly workflows. Checks out `landing`, generates one
# post for the given category, commits, builds, and deploys to Cloudflare.
# Posts are usefulness/SEO-first (outbound links); Refocus is optional & soft.

on:
  workflow_call:
    inputs:
      category:
        description: "productivity | adhd | exams | loneliness | remote"
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout landing branch
        uses: actions/checkout@v4
        with:
          ref: landing
          # Need a token that can push; default GITHUB_TOKEN is fine for same repo.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: marketing/package-lock.json

      - name: Install marketing dependencies
        working-directory: marketing
        run: npm ci

      - name: Generate ${{ inputs.category }} post
        working-directory: marketing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          POST_CATEGORY: ${{ inputs.category }}
        run: node scripts/generate-post.mjs --category "${{ inputs.category }}"

      - name: Commit & push to landing
        run: |
          git config user.name "refocus-blog-bot"
          git config user.email "bot@refocus.co.in"
          # Rebase if another niche pushed while we were generating
          git pull --rebase origin landing || true
          if [ -n "$(git status --porcelain marketing/src/content/blog)" ]; then
            git add marketing/src/content/blog
            git commit -m "blog(${{ inputs.category }}): auto-generated post ($(date -u +%Y-%m-%d))"
            for i in 1 2 3; do
              git push origin HEAD:landing && break
              echo "Push conflict — rebase and retry ($i)"
              git pull --rebase origin landing
              sleep 5
            done
          else
            echo "No new post to commit."
          fi

      - name: Build site
        working-directory: marketing
        run: npm run build

      - name: Deploy to Cloudflare Pages
        working-directory: marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy dist
          --project-name refocus-marketing
          --branch landing
          --commit-dirty=true
