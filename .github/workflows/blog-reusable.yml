name: Blog niche (reusable)

# Called by the daily English slot (1/day), the locale daily rotator, or a
# per-niche manual run. Checks out `landing`, generates one post (topic-first
# dedupe, strict quality gate; illustrations skipped in CI), commits only when
# a post clears the gate, then builds and deploys to Cloudflare.

on:
  workflow_call:
    inputs:
      category:
        description: "Niche id (locale: original five; English slots rotate community niches)"
        required: false
        type: string
      slot:
        description: "0, 1, or 2 — picks a rotating niche when category is omitted"
        required: false
        type: string
      locale:
        description: "en | id | fil | vi | de"
        required: false
        type: string
        default: en

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout landing branch
        uses: actions/checkout@v4
        with:
          ref: landing
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: marketing/package-lock.json

      - name: Install marketing dependencies
        working-directory: marketing
        run: npm ci

      - name: Resolve category
        id: niche
        env:
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_SLOT: ${{ inputs.slot }}
          INPUT_LOCALE: ${{ inputs.locale }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_CATEGORY}" ]; then
            CATEGORY="$INPUT_CATEGORY"
          elif [ -n "${INPUT_SLOT}" ]; then
            DAY=$(( $(date -u +%s) / 86400 ))
            if [ "${INPUT_LOCALE:-en}" = "en" ]; then
              # English community niches — 1 scheduled post/day × 10 niches
              NICHES=(med-school phd engineers parents career-switch writers law nurses founders teachers)
              if [ "$INPUT_SLOT" = "0" ]; then
                INDEX=$(( DAY % 10 ))
              else
                # Manual afternoon/evening: still rotate, offset from morning
                INDEX=$(( (DAY + INPUT_SLOT) % 10 ))
              fi
            else
              # Locale manual slots still use the original five
              NICHES=(productivity adhd exams loneliness remote)
              INDEX=$(( (DAY * 3 + INPUT_SLOT) % 5 ))
            fi
            CATEGORY="${NICHES[$INDEX]}"
            echo "Rotation: day=$DAY slot=$INPUT_SLOT locale=${INPUT_LOCALE:-en} → $CATEGORY"
          else
            echo "Provide category or slot" >&2
            exit 1
          fi
          echo "category=$CATEGORY" >> "$GITHUB_OUTPUT"

      - name: Generate ${{ steps.niche.outputs.category }} post (${{ inputs.locale }})
        working-directory: marketing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          POST_CATEGORY: ${{ steps.niche.outputs.category }}
          POST_LOCALE: ${{ inputs.locale }}
          SKIP_IMAGE: "1"
          STRICT_QUALITY: "1"
        run: >-
          node scripts/generate-post.mjs
          --category "${{ steps.niche.outputs.category }}"
          --locale "${{ inputs.locale }}"
          --skip-image
          --strict

      - name: Commit & push to landing
        id: commit
        env:
          LOCALE: ${{ inputs.locale }}
          CATEGORY: ${{ steps.niche.outputs.category }}
        run: |
          git config user.name "refocus-blog-bot"
          git config user.email "bot@refocus.co.in"
          git pull --rebase origin landing || true
          case "$LOCALE" in
            id)
              BLOG_PATH="marketing/src/content/blog-id"
              COMMIT_PREFIX="blog(id/$CATEGORY)"
              ;;
            fil)
              BLOG_PATH="marketing/src/content/blog-fil"
              COMMIT_PREFIX="blog(fil/$CATEGORY)"
              ;;
            vi)
              BLOG_PATH="marketing/src/content/blog-vi"
              COMMIT_PREFIX="blog(vi/$CATEGORY)"
              ;;
            de)
              BLOG_PATH="marketing/src/content/blog-de"
              COMMIT_PREFIX="blog(de/$CATEGORY)"
              ;;
            *)
              BLOG_PATH="marketing/src/content/blog"
              COMMIT_PREFIX="blog($CATEGORY)"
              ;;
          esac
          IMAGE_PATH="marketing/public/blog"
          if [ -n "$(git status --porcelain "$BLOG_PATH" "$IMAGE_PATH" 2>/dev/null || true)" ]; then
            git add "$BLOG_PATH"
            if [ -d "$IMAGE_PATH" ]; then
              git add "$IMAGE_PATH"
            fi
            git commit -m "$COMMIT_PREFIX: auto-generated post ($(date -u +%Y-%m-%d))"
            for i in 1 2 3; do
              git push origin HEAD:landing && break
              echo "Push conflict — rebase and retry ($i)"
              git pull --rebase origin landing
              sleep 5
            done
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new post to commit."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        if: steps.commit.outputs.published == 'true'
        working-directory: marketing
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.published == 'true'
        working-directory: marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy dist
          --project-name refocus-marketing
          --branch landing
          --commit-dirty=true
