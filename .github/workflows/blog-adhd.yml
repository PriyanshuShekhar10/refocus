name: "Blog: ADHD"

# Manual only — scheduled publishing is blog-publish.yml (Mon/Wed/Fri).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-niche-adhd
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      category: adhd
    secrets: inherit
