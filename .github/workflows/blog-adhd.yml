name: "Blog: ADHD"

# Manual only — scheduled English publishing is blog-slot-0/1/2; locale/DE keep original five.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-niche-adhd
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      category: adhd
    secrets: inherit
