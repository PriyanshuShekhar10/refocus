name: "Blog: ADHD & mental health"

# ADHD / mental health niche — once daily at 09:00 UTC (~14:30 IST).
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-niche-adhd
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      category: adhd
    secrets: inherit
