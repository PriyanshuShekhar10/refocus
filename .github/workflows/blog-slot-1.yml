name: "Blog: afternoon slot (English)"

# Second of three English posts/day. Niche rotates across ten community
# categories (med-school … teachers).
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-slot-1
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      slot: "1"
      locale: en
    secrets: inherit
