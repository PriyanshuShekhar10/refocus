name: "Blog: afternoon slot"

# Second of three daily posts. Niche rotates across the five categories.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-slot-1
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      slot: "1"
    secrets: inherit
