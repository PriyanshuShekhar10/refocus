name: "Blog: afternoon slot (English)"

# Manual only — scheduled English publishing is one post/day via blog-slot-0.
# Niche rotates across ten community categories when a slot is supplied.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-slot-1
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      slot: "1"
      locale: en
    secrets: inherit
