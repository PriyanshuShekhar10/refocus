name: Deploy marketing site

# Builds and deploys the Astro marketing site (refocus.co.in) to Cloudflare
# Pages on every push to the `landing` branch that touches `marketing/`.
# The dashboard lives on `test-dash` and is deployed by Vercel separately.

on:
  push:
    branches: [landing]
    paths:
      - "marketing/**"
      - ".github/workflows/deploy-marketing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-marketing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        working-directory: marketing
        run: npm ci

      - name: Build site
        working-directory: marketing
        run: npm run build

      - name: Deploy to Cloudflare Pages
        working-directory: marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy dist
          --project-name refocus-marketing
          --branch landing
          --commit-dirty=true
