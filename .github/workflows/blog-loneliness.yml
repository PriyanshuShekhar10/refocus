name: "Blog: Loneliness & studying alone"

# Loneliness / quiet co-presence niche — once daily at 15:00 UTC (~20:30 IST).
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-niche-loneliness
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      category: loneliness
    secrets: inherit
