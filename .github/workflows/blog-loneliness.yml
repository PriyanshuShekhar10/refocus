name: "Blog: Loneliness & studying alone"

# Manual only — scheduled publishing is the 3 rotating daily slots.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-niche-loneliness
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      category: loneliness
    secrets: inherit
