name: "Blog: Nursing & shift work"

# Manual only — scheduled English publishing is blog-slot-0/1/2.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-niche-nurses
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      category: nurses
      locale: en
    secrets: inherit
