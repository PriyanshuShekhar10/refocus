name: "Blog: Vietnamese (evening)"

# One Vietnamese post per day at 18:00 UTC. Niche rotates across five categories.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-vi-slot-0
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      locale: vi
      slot: "3"
    secrets: inherit
