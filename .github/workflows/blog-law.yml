name: "Blog: Law school & articling"

# Manual only — scheduled English publishing is blog-slot-0/1/2.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-niche-law
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      category: law
      locale: en
    secrets: inherit
