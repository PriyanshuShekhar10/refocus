name: "Blog: Remote work & freelancing"

# Remote / freelance niche — once daily at 18:00 UTC (~23:30 IST).
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-niche-remote
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      category: remote
    secrets: inherit
