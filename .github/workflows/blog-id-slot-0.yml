name: "Blog: Indonesian (manual)"

# Manual only — scheduled non-English publishing is blog-locale-daily.yml
# (1 post/day cycling id → fil → vi).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-id-slot-0
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      locale: id
      slot: "1"
    secrets: inherit
