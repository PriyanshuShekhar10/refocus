name: "Blog: Indonesian (afternoon)"

# First of two daily Bahasa posts (12:00 UTC). Niche rotates across five categories.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-id-slot-0
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      locale: id
      slot: "0"
    secrets: inherit
