name: "Blog: Filipino Tagalog (afternoon)"

# One Tagalog post per day at 14:00 UTC. Niche rotates across five categories.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-fil-slot-0
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/blog-reusable.yml
    with:
      locale: fil
      slot: "2"
    secrets: inherit
